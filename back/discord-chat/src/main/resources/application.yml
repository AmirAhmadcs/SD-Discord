server:
  port: 8082

spring:
  application:
    name: discord-chat
  datasource:
    url: jdbc:postgresql://localhost:5435/discord_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/discord-realm

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/