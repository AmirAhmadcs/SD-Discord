services:
  postgres-main:
    image: postgres:16
    container_name: postgres-main
    environment:
      POSTGRES_DB: discord_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432" # ✅ تغییر از 5432 به 5435
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
    networks:
      - discord-network

  postgres-keycloak:
    image: postgres:16
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # این پورت فقط برای کی‌کلاک است و تداخلی ندارد
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - discord-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak-server
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db # ✅ شد 5432
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres-keycloak
    networks:
      - discord-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - discord-network

  # ✅ سرویس ردیس (دقیقا مطابق با چیزی که در Presence نوشتیم)
  redis:
    image: redis:alpine
    container_name: discord-redis
    ports:
      - "6379:6379"
    networks:
      - discord-network

  # ✅ سرویس مینIO (دقیقا مطابق با فایل application.yml مدیا که فرستادی)
  minio:
    image: minio/minio
    container_name: discord-minio
    environment:
      # ✅ تغییر یافت تا دقیقا با application.yml مدیا همخوانی داشته باشد
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # پنل کاربری
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - discord-network

networks:
  discord-network:
    driver: bridge

volumes:
  postgres_main_data:
  postgres_keycloak_data:
  minio_data: